name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax and manifest checks
        run: npm run check
      - name: Build both browsers
        run: npm run build
      - name: Lint the Firefox build
        run: npx --yes web-ext@8 lint --source-dir dist/firefox
