name: Other bug
description: Something broken in the popup, settings page or elsewhere.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Steps to reproduce, what you expected and what you saw.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Optional. Errors from the extension's service worker or the page console.
      render: text
